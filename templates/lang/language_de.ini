PORTAINER_TITEL="Portainer"
PORTAINER_TEXT="Portainer ist die Verwaltungsoberfläche für die auf diesem LoxBerry laufenden Docker-Container. Sie läuft als eigener Container und öffnet sich in einem eigenen Fenster."
B_OEFFNEN="Portainer öffnen"
B_OEFFNEN_HTTPS="Portainer über HTTPS öffnen"
WARNUNG_PORT_BELEGT="Port %s wird inzwischen von einem anderen Dienst verwendet, Portainer kann darauf nicht starten. Bitte wählen Sie unter „Ports“ einen freien Port und speichern Sie ihn."

PASSWORT_TITEL="Administratorkennwort"
PASSWORT_TEXT="Bei der Ersteinrichtung wurde für die Anmeldung an Portainer automatisch ein zufälliges Kennwort erzeugt. Es lässt sich unter „Portainer öffnen“ mit dem Benutzernamen „admin“ verwenden."
PASSWORT_ANZEIGEN="Kennwort anzeigen"
PASSWORT_UNBEKANNT="Für dieses Portainer ist kein automatisch erzeugtes Kennwort hinterlegt. Entweder wurde das Administratorkonto bereits vor dieser Plugin-Fassung angelegt, oder das Kennwort wurde seither in Portainer selbst geändert."
B_PASSWORT_ZURUECKSETZEN="Kennwort zurücksetzen"
PASSWORT_ZURUECKSETZEN_TEXT="Falls das Kennwort für „admin“ nicht mehr bekannt ist, lässt es sich hier zurücksetzen. Portainer vergibt dabei ein neues Kennwort, das anschließend hier angezeigt wird. Portainer ist währenddessen kurz nicht erreichbar."
PASSWORT_ZURUECKSETZEN_FRAGE="Das Kennwort für „admin“ wird zurückgesetzt und Portainer kurz neu gestartet. Möchten Sie fortfahren?"
MELDUNG_PASSWORT_ZURUECKGESETZT="Das Kennwort wurde zurückgesetzt. Das neue Kennwort finden Sie unter „Kennwort anzeigen“."
FEHLER_PASSWORT_ZURUECKSETZEN="Das Kennwort ließ sich nicht zurücksetzen: %s"
PASSWORT_GEAENDERT="Das automatisch erzeugte Kennwort wurde in Portainer geändert und kann hier deshalb nicht mehr angezeigt werden. Bitte melden Sie sich mit dem Kennwort an, das Sie in Portainer vergeben haben."

PORTS_TITEL="Ports"
PORTS_TEXT="Über diese Ports ist Portainer im Netzwerk erreichbar. Beim Speichern wird Portainer mit den neuen Ports neu aufgebaut, Kennwort und Einstellungen bleiben erhalten. „Freie Ports suchen“ trägt freie Ports nur als Vorschlag ein, übernommen werden sie erst mit „Ports speichern“."
PORT_HTTP="HTTP-Port"
PORT_HTTPS="HTTPS-Port"
B_PORTS_SPEICHERN="Ports speichern"
B_PORTS_SUCHEN="Freie Ports suchen"
MELDUNG_PORTS_GESPEICHERT="Die Ports wurden gespeichert und Portainer wurde neu eingerichtet."
MELDUNG_PORTS_VORSCHLAG="Freie Ports wurden eingetragen. Bitte übernehmen Sie sie mit „Ports speichern“."
MELDUNG_PORTS_FREI="Die aktuellen Ports sind frei, eine Änderung ist nicht nötig."
FEHLER_PORT_UNGUELTIG="Die Ports müssen Zahlen von 1024 bis 65535 sein."
FEHLER_PORT_GLEICH="HTTP-Port und HTTPS-Port dürfen nicht gleich sein."
FEHLER_PORT_BELEGT="Port %s wird bereits von einem anderen Dienst verwendet. Bitte wählen Sie einen anderen Port oder nutzen Sie „Freie Ports suchen“."
FEHLER_PORT_PRUEFUNG="Die Portbelegung ließ sich nicht prüfen, das Programm ss meldet einen Fehler. Details stehen im Plugin-Protokoll."
FEHLER_KEIN_PORT="Es ist kein freier Port verfügbar."

B_NEUEINRICHTEN="Portainer neu einrichten"
NEUEINRICHTEN_TEXT="Entfernt den Portainer-Container und baut ihn neu auf. Einstellungen und Administratorkennwort bleiben dabei unverändert. Nur wenn Portainer noch kein Administratorkonto besitzt, wird eines mit einem neuen Kennwort angelegt. Ein vergessenes Kennwort lässt sich über „Kennwort zurücksetzen“ neu vergeben."
MELDUNG_NEUEINGERICHTET="Portainer wurde neu eingerichtet."
FEHLER_NEUEINRICHTEN="Portainer ließ sich nicht neu einrichten: %s"

