[HELP]
INTRO="This plugin installs the Docker container engine on the LoxBerry. For management, Portainer is started as its own container; its administrator password is generated automatically during setup and shown in the interface. The state of all containers is also reported every five minutes via MQTT, so it can be wired up in Loxone Config."
WIKI_INFO="Detailed documentation for this plugin:"
