[HELP]
INTRO="Dieses Plugin installiert die Container-Engine Docker auf dem LoxBerry. Zur Verwaltung wird zusätzlich Portainer als eigener Container gestartet, dessen Administratorkennwort bei der Einrichtung automatisch erzeugt und in der Oberfläche angezeigt wird. Der Zustand aller Container wird außerdem alle fünf Minuten per MQTT gemeldet, sodass er sich in Loxone Config einbinden lässt."
LINK_INFO="Mehr Informationen zu diesem Plugin können auf der LoxBerry-Wiki-Seite gefunden werden:"
LINK="https://wiki.loxberry.de/plugins/docker-ng/start"
LINK_TEXT="Docker NG im LoxBerry-Wiki"

